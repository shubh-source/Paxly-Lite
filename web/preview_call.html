<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vlynxly Call UI Preview</title>
  <style>
    :root {
      --bg: #0D0D0F;
      --s1: rgba(22, 22, 24, 0.4);
      --border: rgba(255,255,255,0.05);
      --accent: #C9A96E;
      --accent-g: rgba(201,169,110,0.2);
      --text: #F4F4F5;
      --muted: #A1A1AA;
      --danger: #FF3B30;
      --success: #34C759;
      --purple: #7C6FCD;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #000;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      gap: 40px;
    }
    .phone-container {
      width: 375px;
      height: 812px;
      border-radius: 40px;
      overflow: hidden;
      position: relative;
      border: 8px solid #222;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    
    @keyframes pulseBg { from { filter: hue-rotate(0deg); } to { filter: hue-rotate(45deg); } }
    @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
    @keyframes bounce { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.1); } }

    /* Avatar */
    .avatar {
      display: flex; align-items: center; justify-content: center;
      background: var(--s1); color: var(--text); font-weight: 700;
      border-radius: 50%; border: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <!-- CALLING STATE -->
  <div class="phone-container">
    <div style="position: absolute; inset: 0; background: linear-gradient(45deg, #0f0c29, #302b63, #24243e); animation: pulseBg 10s infinite alternate;"></div>
    
    <div style="position: relative; z-index: 20; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <div style="background: rgba(255,255,255,0.05); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 40px; border-radius: 32px; border: 1px solid rgba(255,255,255,0.1); text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: float 4s infinite ease-in-out;">
        <div style="position: relative; margin: 0 auto 24px; width: 100px; height: 100px;">
          <div style="position: absolute; inset: -10px; border-radius: 50%; background: var(--accent); opacity: 0.2; animation: ping 2s infinite;"></div>
          <div class="avatar" style="width: 100px; height: 100px; font-size: 2rem; border: 3px solid var(--accent); position: relative; z-index: 2;">S</div>
        </div>
        <h2 style="color: #fff; font-size: 1.8rem; margin: 0 0 8px;">Shubham</h2>
        <p style="color: rgba(255,255,255,0.5); letter-spacing: 0.1em; margin: 0; font-size: 0.8rem;">CALLING...</p>
        
        <div style="margin-top: 40px; display: flex; gap: 32px; justify-content: center;">
          <button style="background: var(--danger); border: none; border-radius: 50%; width: 72px; height: 72px; font-size: 1.8rem; cursor: pointer; box-shadow: 0 10px 20px rgba(255,59,48,0.3); color: white;">📵</button>
        </div>
      </div>
    </div>
  </div>

  <!-- CONNECTED VIDEO STATE -->
  <div class="phone-container">
    <div style="position: absolute; inset: 0; background: linear-gradient(45deg, #0f0c29, #302b63, #24243e); opacity: 0.3; animation: pulseBg 10s infinite alternate;"></div>
    
    <!-- Fake Remote Video (Background Image) -->
    <div style="position: absolute; inset: 0; width: 100%; height: 100%; background: url('https://images.unsplash.com/photo-1529626455594-4ff0802cfb7e?ixlib=rb-1.2.1&auto=format&fit=crop&w=800&q=80') center/cover; z-index: 1;"></div>
    
    <!-- Fake Local PiP Video -->
    <div style="position: absolute; top: 40px; right: 20px; width: 100px; height: 140px; border-radius: 16px; border: 2px solid rgba(255,255,255,0.2); z-index: 10; background: url('https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?ixlib=rb-1.2.1&auto=format&fit=crop&w=400&q=80') center/cover;"></div>
    
    <div style="position: absolute; bottom: 40px; left: 20px; right: 20px; display: flex; flex-direction: column; gap: 20px; z-index: 20;">
      <div style="align-self: center; background: rgba(0,0,0,0.6); padding: 6px 14px; border-radius: 99px; color: var(--accent); font-weight: 600; font-size: 0.9rem; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);">
        04:20
      </div>
      
      <div style="display: flex; justify-content: space-around; align-items: center; background: rgba(255,255,255,0.15); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 20px; border-radius: 32px; border: 1px solid rgba(255,255,255,0.2);">
        <button style="background: rgba(255,255,255,0.1); border: none; border-radius: 50%; width: 56px; height: 56px; font-size: 1.4rem; color: #fff;">🎙️</button>
        <button style="background: rgba(255,255,255,0.1); border: none; border-radius: 50%; width: 56px; height: 56px; font-size: 1.4rem; color: #fff;">🖼️</button>
        <button style="background: rgba(255,255,255,0.1); border: none; border-radius: 50%; width: 56px; height: 56px; font-size: 1.4rem; color: #fff;">🔳</button>
        <button style="background: var(--danger); border: none; border-radius: 50%; width: 64px; height: 64px; font-size: 1.6rem; color: #fff; box-shadow: 0 10px 20px rgba(255,59,48,0.3);">📵</button>
      </div>
    </div>
  </div>

</body>
</html>

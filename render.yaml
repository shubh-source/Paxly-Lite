services:
  - type: web
    name: Paxly-Lite
    runtime: docker
    rootDir: backend
    branch: main
    dockerfilePath: ./Dockerfile
    disk:
      name: vlynxly-media-disk
      mountPath: /app/media
      sizeGB: 10
    healthCheckPath: /api/health/ping
    envVars:
      - key: PORT
        value: 10000
      - key: WEB_CONCURRENCY
        value: 1
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: PREVIOUS_ENCRYPTION_KEYS
        sync: false
      - key: STORAGE_MODE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: vlynxly-media
      - key: BACKEND_URL
        value: https://paxly-lite.onrender.com
      - key: FRONTEND_URL
        value: https://paxly-lite.vercel.app
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Paxly <onboarding@resend.dev>
      - key: GOOGLE_SCRIPT_URL
        value: https://script.google.com/macros/s/AKfycbz7qWWQz1fpV7AjslCXQRaV-Lvrhb70IMUkZKD9V7W19um7bge3b-dWGnVgb_5oWuZ5/exec

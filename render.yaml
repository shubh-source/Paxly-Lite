services:
  - type: web
    name: Paxly-Lite
    runtime: docker
    rootDir: backend
    branch: main
    dockerfilePath: ./Dockerfile
    disk:
      name: vlynxly-media-disk
      mountPath: /app/media
      sizeGB: 10
    healthCheckPath: /api/health/ping
    envVars:
      - key: PORT
        value: 10000
      - key: WEB_CONCURRENCY
        value: 1
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: PREVIOUS_ENCRYPTION_KEYS
        sync: false
      - key: STORAGE_MODE
        value: supabase
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: SUPABASE_BUCKET
        value: vlynxly-media
      - key: BACKEND_URL
        value: https://paxly-lite.onrender.com
      - key: FRONTEND_URL
        value: https://paxly-lite.vercel.app
